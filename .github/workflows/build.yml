name: Build

# main에 푸시하면 Windows exe와 Android apk를 빌드해, molcom/__init__.py의
# 버전에 해당하는 릴리스에 올린다. 같은 버전의 릴리스가 있으면 파일을 교체한다.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MolCom.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          gradle -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk MolCom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MolCom.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' molcom/__init__.py)"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" out/MolCom.exe out/MolCom.apk --clobber
          else
            gh release create "$version" out/MolCom.exe out/MolCom.apk \
              --target "$GITHUB_SHA" --title "MolCom $version" --generate-notes
          fi
