name: Build Windows exe

# molcom/__init__.py의 버전을 올려 main에 푸시하면 그 버전의 릴리스가 만들어진다.
on:
  push:
    branches: [main]
    paths:
      - "molcom/__init__.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: MolCom-windows-x64
          path: dist/MolCom.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(python -c 'import molcom; print(molcom.__version__)')"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/MolCom.exe --clobber
          else
            gh release create "$version" dist/MolCom.exe --target "$GITHUB_SHA" \
              --title "MolCom $version" --generate-notes
          fi
